[k8s_master]
master ansible_host=YOUR_MASTER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[k8s_workers]
worker1 ansible_host=YOUR_WORKER1_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem
worker2 ansible_host=YOUR_WORKER2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
